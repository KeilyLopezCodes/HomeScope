version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgresDB
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin123456
      POSTGRES_DB: HomeScope
    ports:
      - "5432:5432"
    volumes:
      - postgres_dataDB:/var/lib/postgresql

volumes:
  postgres_dataDB: